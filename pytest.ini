[pytest]
# `pytest` or `pytest tests/ -v` runs the offline suite: fast, free, no API key.
# The live tests call the real LLM; run them on purpose with `pytest -m live`.
testpaths = tests
python_files = *_test.py test_*.py
addopts = -m "not live"
markers =
    live: calls the real LLM (needs an API key, costs money, results can vary); run with -m live
filterwarnings =
    # langgraph 1.x: create_react_agent moved to langchain.agents (used on purpose; see requirements.txt)
    ignore:create_react_agent has been moved
